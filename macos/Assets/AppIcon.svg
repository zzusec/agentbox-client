<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#162A40"/>
      <stop offset="0.55" stop-color="#0C1B2D"/>
      <stop offset="1" stop-color="#06111E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#123D3B"/>
      <stop offset="1" stop-color="#082121"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#020617" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
