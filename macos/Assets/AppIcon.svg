    <path d="M300 378l72 68-72 68" fill="none" stroke="url(#accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="422" y="496" width="192" height="34" rx="17" fill="#99F6E4"/>
